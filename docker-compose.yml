# ============================================================================
# Billing System REST API — Local Development & Testing Docker Compose
# ============================================================================
# NOTE: This file is strictly for local development and containerized integration
# testing (API container + externalized PostgreSQL 15 container over a bridge network).
# It is NOT a production cloud deployment configuration (see cloudrun.service.yaml).
#
# SECURITY WARNING — DEVELOPMENT-ONLY CREDENTIALS:
# All fallback passwords (`postgres_local_dev_only`) and fallback JWT signing keys
# (`dev-only-local-compose-jwt-secret-do-not-use-in-production`) defined below are
# strictly for local development convenience. Production startup (`NODE_ENV=production`)
# fails closed with `SecurityConfigurationError` if any development-only fallback or
# placeholder secret is used. Never commit real production credentials.
# ============================================================================

services:
  postgres:
    image: postgres:15-bookworm
    container_name: billing-postgres-local
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      # DEVELOPMENT-ONLY fallback password for local Docker Compose; rejected in NODE_ENV=production
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_local_dev_only}
      POSTGRES_DB: ${POSTGRES_DB:-billing_system}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - billing_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-billing_system}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - billing_net

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: billing-system-api:phase10
    container_name: billing-api-local
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Defaults to 'development' so local `docker compose up` works out-of-the-box with
      # development-only fallback credentials while NODE_ENV=production fails closed.
      NODE_ENV: ${NODE_ENV:-development}
      HOST: 0.0.0.0
      PORT: 3000
      # DEVELOPMENT-ONLY database connection fallback for local Docker bridge network
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_local_dev_only}@postgres:5432/${POSTGRES_DB:-billing_system}
      # DEVELOPMENT-ONLY fallback JWT secret; rejected by resolveAndValidateJwtSecret in NODE_ENV=production
      JWT_SECRET: ${JWT_SECRET:-dev-only-local-compose-jwt-secret-do-not-use-in-production}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-86400}
      RATE_LIMIT_MODE: ${RATE_LIMIT_MODE:-process_local}
      AUTH_RATE_LIMIT_WINDOW_MS: ${AUTH_RATE_LIMIT_WINDOW_MS:-60000}
      AUTH_RATE_LIMIT_MAX: ${AUTH_RATE_LIMIT_MAX:-30}
      API_RATE_LIMIT_WINDOW_MS: ${API_RATE_LIMIT_WINDOW_MS:-60000}
      API_RATE_LIMIT_MAX: ${API_RATE_LIMIT_MAX:-300}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      ENABLE_HSTS: ${ENABLE_HSTS:-false}
    ports:
      - "${PORT:-3000}:3000"
    read_only: true
    tmpfs:
      - /tmp
    networks:
      - billing_net

volumes:
  billing_pgdata:

networks:
  billing_net:
    driver: bridge
